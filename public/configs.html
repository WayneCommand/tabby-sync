<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabby Sync - Configs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #e5e5ea;
        }
        .info-card {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0,0,0,0.06);
        }
        .tab-btn.active {
            color: #1d1d1f;
            border-bottom: 2px solid #1d1d1f;
        }
        .tab-btn {
            color: #8e8e93;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: #1d1d1f;
        }
        .config-row {
            transition: background 0.15s;
        }
        .config-row:hover {
            background: #f0f0f2;
        }
        .token-display {
            font-family: 'SF Mono', 'SFMono-Regular', 'ui-monospace', 'DejaVu Sans Mono', monospace;
            font-size: 0.8125rem;
            word-break: break-all;
            background: #f5f5f7;
            border: 1px solid #e5e5ea;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-gray-200 z-10">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-semibold">Tabby Sync Service</h1>
            <div class="flex items-center gap-3">
                <span id="header-user" class="text-sm text-gray-500 hidden"></span>
                <button id="logout-btn" class="text-sm text-gray-500 hover:text-gray-800 transition-colors hidden">退出</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-8">
        <div class="flex gap-8">
            <!-- Left: User Profile Card -->
            <aside class="w-72 shrink-0">
                <div id="profile-card" class="info-card rounded-2xl p-6 hidden">
                    <div class="flex flex-col items-center text-center mb-5">
                        <img id="avatar-img" class="profile-avatar mb-3" alt="avatar" />
                        <h2 id="display-name" class="text-lg font-semibold"></h2>
                        <p id="github-name" class="text-sm text-gray-500"></p>
                    </div>
                    <div class="border-t border-gray-200/60 pt-4 space-y-3 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500">User ID</span>
                            <span id="user-id" class="font-medium"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Pro</span>
                            <span id="user-pro" class="font-medium"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Sponsor</span>
                            <span id="user-sponsor" class="font-medium"></span>
                        </div>
                    </div>
                </div>

                <div id="login-prompt" class="info-card rounded-2xl p-8 text-center">
                    <p class="text-gray-500 mb-4">请先登录</p>
                    <a href="/" class="inline-block bg-gray-900 text-white px-5 py-2 rounded-lg text-sm hover:bg-gray-800 transition-colors">返回首页</a>
                </div>
            </aside>

            <!-- Right: Tabbed Content -->
            <div class="flex-1 min-w-0">
                <!-- Tab bar -->
                <div class="flex gap-6 border-b border-gray-200 mb-6">
                    <button class="tab-btn active pb-3 text-sm font-medium" data-tab="configs">配置列表</button>
                    <button class="tab-btn pb-3 text-sm font-medium" data-tab="token">Token</button>
                </div>

                <!-- Tab: Configs -->
                <div id="tab-configs" class="tab-content">
                    <div id="config-list" class="space-y-1">
                        <!-- config rows injected here -->
                    </div>
                    <div id="config-empty" class="text-center py-16 text-gray-400 hidden">
                        <p class="text-lg mb-1">暂无配置</p>
                        <p class="text-sm">从 Tabby 终端应用同步配置后将会显示在这里</p>
                    </div>
                </div>

                <!-- Tab: Token -->
                <div id="tab-token" class="tab-content hidden">
                    <div class="info-card rounded-2xl p-6">
                        <h3 class="text-sm font-medium text-gray-500 mb-3">Sync Token</h3>
                        <div id="token-display" class="token-display rounded-xl p-4 mb-4 select-all"></div>
                        <button id="copy-token-btn" class="text-sm text-white bg-gray-900 px-4 py-2 rounded-lg hover:bg-gray-800 transition-colors">复制 Token</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ---------- init ----------
            const token = new URLSearchParams(location.search).get('userKey') || localStorage.getItem('tabby-token');
            if (token) {
                localStorage.setItem('tabby-token', token);
                // clean url
                if (location.search) history.replaceState(null, '', location.pathname);
                initApp(token);
            }

            // ---------- tab switching ----------
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
                    document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
                });
            });

            // ---------- logout ----------
            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('tabby-token');
                location.href = '/';
            });

            // ---------- copy token ----------
            document.getElementById('copy-token-btn').addEventListener('click', async () => {
                const text = document.getElementById('token-display').textContent;
                try {
                    await navigator.clipboard.writeText(text);
                    const btn = document.getElementById('copy-token-btn');
                    btn.textContent = '已复制';
                    setTimeout(() => btn.textContent = '复制 Token', 2000);
                } catch {}
            });

            // ---------- main ----------
            async function initApp(token) {
                try {
                    const [user, configs] = await Promise.all([
                        fetch('/api/1/users', { headers: { Authorization: 'Bearer ' + token } }).then(r => r.json()),
                        fetch('/api/1/configs', { headers: { Authorization: 'Bearer ' + token } }).then(r => r.json())
                    ]);

                    renderProfile(user);
                    renderConfigs(Array.isArray(configs) ? configs : []);
                    renderToken(token);
                    toggleUI(true);
                } catch (e) {
                    console.error('init error', e);
                }
            }

            function renderProfile(u) {
                document.getElementById('display-name').textContent = u.username || 'Unnamed';
                document.getElementById('github-name').textContent = '@' + (u.github_username || '-');
                document.getElementById('user-id').textContent = u.id;
                document.getElementById('user-pro').textContent = u.is_pro ? 'Yes' : 'No';
                document.getElementById('user-sponsor').textContent = u.is_sponsor ? 'Yes' : 'No';
                document.getElementById('avatar-img').src = 'https://github.com/' + (u.github_username || '') + '.png?size=80';
                document.getElementById('header-user').textContent = u.username || '';
            }

            function renderConfigs(configs) {
                const list = document.getElementById('config-list');
                const empty = document.getElementById('config-empty');
                list.innerHTML = '';

                if (configs.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }
                empty.classList.add('hidden');

                configs.forEach(c => {
                    const row = document.createElement('div');
                    row.className = 'config-row flex justify-between items-center px-4 py-3 rounded-xl';
                    const time = c.modified_at ? c.modified_at.replace('T', ' ').slice(0, 19) : '-';
                    row.innerHTML = `
                        <div>
                            <div class="font-medium text-sm">${c.name || 'Unnamed'}</div>
                            <div class="text-xs text-gray-400 mt-0.5">${time}</div>
                        </div>
                        <span class="text-xs text-gray-400">${timeAgo(c.modified_at)}</span>
                    `;
                    list.appendChild(row);
                });
            }

            function renderToken(t) {
                document.getElementById('token-display').textContent = t;
            }

            function toggleUI(show) {
                document.getElementById('profile-card').classList.toggle('hidden', !show);
                document.getElementById('login-prompt').classList.toggle('hidden', show);
                document.getElementById('header-user').classList.toggle('hidden', !show);
                document.getElementById('logout-btn').classList.toggle('hidden', !show);
            }

            function timeAgo(dateStr) {
                const now = Date.now();
                const d = new Date(dateStr).getTime();
                const diff = (now - d) / 1000;
                if (diff < 60) return '刚刚';
                if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
                if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
                return Math.floor(diff / 86400) + '天前';
            }
        });
    </script>
</body>
</html>
